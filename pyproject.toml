[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meural-curator"
version = "0.2.0"
description = "Curate museum art, comic covers and more into Meural Canvas cloud galleries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
meural-curator = "meural_curator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
