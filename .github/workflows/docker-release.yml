name: Build and publish Docker image

# A published release (vX.Y.Z) builds spiegela/reddit-meural:X.Y.Z + latest; a manual run builds latest + sha-<short>.
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. The cluster CronJob (spieg-charts reddit-meural) pins a tag.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest && pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: spiegela/reddit-meural
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
